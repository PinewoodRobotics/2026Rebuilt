plugins {
    id "java"
    id "application"
    id "org.wpilib.GradleRIO" version "2027.0.0-alpha-8"
    id "groovy"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven {
        url = 'https://jitpack.io'
    }
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

def dynamicLibDir = layout.projectDirectory.dir("lib/build")

deploy {
    targets {
        systemcore(getTargetTypeClass('SystemCore')) {
            team = project.wpilib.getTeamNumber()
            useDefaultSystemcoreHostName()
            debug = project.wpilib.getDebugOrDefault(false)

            artifacts {
                wpilibJava(getArtifactTypeClass('WPILibJavaArtifact')) {
                    debugJni = false
                }

                wpilibStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/systemcore/deploy'
                    deleteOldFiles = false
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.systemcore.artifacts.wpilibJava

wpi.java.runSimWithDebugJni = false

def includeDesktopSupport = false

def buildDynamicDepsTask = tasks.register("buildDynamicDeps") {
    group = "build setup"
    description = "Clones/builds dynamic deps and drops jars into lib/build"

    inputs.file("config.ini")
    outputs.dir(dynamicLibDir)
    outputs.upToDateWhen { false }  // run every build cycle so deps are always refreshed

    def javaHome =
            System.getenv("JAVA_HOME")
            ?: (project.findProperty("org.gradle.java.home") as String)
            ?: System.getProperty("java.home")
    def projectDir = layout.projectDirectory.asFile
    def execProvider = providers.exec {
        workingDir = projectDir
        environment "JAVA_HOME", javaHome
        environment "PATH", "${javaHome}/bin:${System.getenv("PATH")}"
        commandLine "python3", "scripts/clone_and_build_repos.py",
                "--config-file-path", "config.ini"
        ignoreExitValue = true
    }

    doLast {
        def out = execProvider.standardOutput.asText.get().trim()
        def err = execProvider.standardError.asText.get().trim()
        if (out) println out
        if (err) println err
        def exitValue = execProvider.result.get().exitValue
        if (exitValue != 0) {
            throw new GradleException("clone_and_build_repos.py failed with exit code ${exitValue}")
        }
    }
}

// Create a provider that forces lazy evaluation of the directory
// This ensures VSCode picks up new JARs when it refreshes the classpath
def dynamicJarsProvider = buildDynamicDepsTask.map {
    dynamicLibDir
}

dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    systemcoreDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.systemcore)
    systemcoreDebug wpi.java.vendor.jniDebug(wpi.platforms.systemcore)

    systemcoreRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.systemcore)
    systemcoreRelease wpi.java.vendor.jniRelease(wpi.platforms.systemcore)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Use provider with fileTree to force lazy evaluation so VSCode picks up new JARs
    implementation(files(dynamicJarsProvider.map { dir ->
        fileTree(dir: dir, include: "*.jar")
    }).builtBy(buildDynamicDepsTask))
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

application.mainClass = ROBOT_MAIN_CLASS

deployArtifact.configureApplication(application)
wpi.java.configureApplication(application)
wpi.java.configureTestTasks(test)

jar {
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
}

tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

tasks.compileJava.dependsOn(tasks.buildDynamicDeps)
